<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Момент — Metatron Trading Intelligence</title>
<meta name="description" content="Срез рынка на сейчас: вердикт дня, три прибора, пульс и тикеры идей. Read-only, без плана сделки.">

<meta property="og:site_name" content="Metatron">
<meta property="og:url" content="https://metatronti.com/moment/">
<meta property="og:title" content="Момент — Metatron">
<meta property="og:description" content="Срез рынка: вердикт дня, три прибора, пульс и тикеры идей.">
<meta property="og:locale" content="ru_RU">

<style>
/* /moment — публичный срез Повестки на КАНОНЕ (DASH-MIGRATE 2.4, 03.11).
   До этой правки страница жила в мокап-айдентике (золото + IBM Plex) и расходилась с продом
   (/agenda и /moment на :3100 — бирюза + Onest). Теперь токены те же, что у .term в oko-dashboard:
   ink/бирюза/Onest, шкала 10–34 px (Д3). Контракт данных — oko.moment/1
   (docs/product/dev/MOMENT-CONTRACT.md). Плана сделки тут нет: Observer «видит», Operator
   «работает»; сокрытие объявлено строкой, а не молчанием. Скелет пустой намеренно:
   до загрузки JSON показываем «—», а не демо-цифры. */
:root{
  --ink:#080b0c; --ink-2:#0e1315; --ink-3:#141c1e; --ink-4:#192224;
  --paper:#eef2f0; --paper-dim:#8a9a97; --paper-dimmer:#7A838F;
  --teal:#37e0c4; --teal-06:rgba(55,224,196,.06); --teal-12:rgba(55,224,196,.12);
  --red:#e2555f; --amber:#e0b437; --green:#37e0a0;
  --white-08:rgba(255,255,255,.08); --white-14:rgba(255,255,255,.14);
  --sans:'Onest',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:12.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-weight:700}
a{color:inherit;text-decoration:none}

/* ── оболочка: рельс + рабочая область (как .term в проде) ─────── */
.term{display:flex;min-height:100dvh;background:var(--ink)}
.rail{width:86px;flex:0 0 86px;border-right:1px solid var(--white-08);background:var(--ink-2);
  display:flex;flex-direction:column;align-items:stretch;padding:12px 8px;gap:4px;position:sticky;top:0;height:100dvh}
.rail-mk{display:block;margin:4px auto 16px;color:var(--teal);filter:drop-shadow(0 0 6px var(--teal-12))}
.rail-i{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:44px;padding:8px 0;border-radius:10px;color:var(--paper-dim);font-size:10.5px}
.rail-i.on{color:var(--teal);background:var(--teal-06)}
.rail-i.locked{color:var(--paper-dimmer);cursor:default}
.rail-ico{position:relative;display:inline-flex}
.rail-lock{position:absolute;top:-.3em;right:-.6em;color:var(--paper-dimmer)}
.work{flex:1;min-width:0;padding-bottom:32px}

/* ── шапка ────────────────────────────────────────────────────── */
.hdr{display:flex;align-items:center;flex-wrap:wrap;gap:12px 16px;padding:12px 24px;
  border-bottom:1px solid var(--white-08);margin-bottom:12px}
.hdr-brand{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-mk{color:var(--teal);flex:none}
.hdr-wm{display:flex;flex-direction:column;line-height:1}
.hdr-nm{font-weight:700;font-size:13px;letter-spacing:-.01em}
.hdr-ct{font-family:var(--mono);font-size:.58em;letter-spacing:.26em;text-transform:uppercase;color:var(--paper-dim);margin-top:.25em;white-space:nowrap}
.hdr-tab{font-weight:500;font-size:11.5px;color:var(--paper-dim);padding-left:16px;border-left:1px solid var(--white-08)}
.hdr-time{color:var(--paper-dim);font-size:11px;font-family:var(--mono);margin-left:auto}
.hdr-chip{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.06em;padding:4px 12px;border-radius:999px;
  border:1px solid var(--tone,var(--paper-dimmer));color:var(--tone,var(--paper-dimmer))}
.hdr-chip::before{content:"";width:.45em;height:.45em;border-radius:50%;background:currentColor}
.hdr-chip.ok{--tone:var(--green)} .hdr-chip.warn{--tone:var(--amber)}
.hdr-cta{font-size:11.5px;font-weight:500;padding:8px 16px;border-radius:10px;background:var(--teal);color:#06100e}
.hdr-cta:hover{filter:brightness(1.08)}

/* ── вердикт ───────────────────────────────────────────────────── */
.mom-verdict{margin:16px 24px 0;padding:20px 24px;border:1px solid var(--white-14);border-left-width:4px;
  border-radius:14px;background:var(--ink-2)}
.mom-verdict.ok{border-left-color:var(--green)} .mom-verdict.warn{border-left-color:var(--amber)}
.mom-verdict.bad{border-left-color:var(--red)} .mom-verdict.na{border-left-color:var(--paper-dimmer)}
.mom-light{display:block;font-size:25px;line-height:1.2;font-weight:700}
.mom-verdict.ok .mom-light{color:var(--green)} .mom-verdict.warn .mom-light{color:var(--amber)}
.mom-verdict.bad .mom-light{color:var(--red)}
.mom-sub{margin:12px 0 0;max-width:78ch;font-size:12.5px}
.mom-measured{margin:12px 0 0;padding-left:12px;border-left:2px solid var(--white-14);
  color:var(--paper-dim);font-size:11.5px}

/* ── приборы ──────────────────────────────────────────────────── */
.mom-h{margin:20px 24px 8px;font-size:11.5px;font-weight:500;text-transform:uppercase;
  letter-spacing:.08em;color:var(--paper-dim)}
.mom-gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-inline:24px}
.mom-gauge{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--ink-2);
  border:1px solid var(--white-08);border-radius:10px}
.mom-gauge.dim{opacity:.85}
.mom-g-lab{color:var(--paper-dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.mom-g-lab em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--paper-dimmer);margin-left:8px}
.mom-g-val{font-family:var(--mono);font-size:17px;font-weight:700}
.mom-g-bar{height:6px;border-radius:999px;background:var(--ink-4);overflow:hidden;display:block}
.mom-g-bar i{display:block;height:100%;border-radius:999px;background:var(--paper-dimmer)}
.mom-g-bar i.ok{background:var(--green)} .mom-g-bar i.warn{background:var(--amber)} .mom-g-bar i.red{background:var(--red)}
.mom-g-note{color:var(--paper-dim);font-size:11px;font-family:var(--mono)}

/* ── пульс ────────────────────────────────────────────────────── */
.mom-pulse{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:12px 24px 0;
  padding:16px;background:var(--ink-2);border:1px solid var(--white-08);border-radius:10px;font-size:11.5px}
.mom-pulse-state{font-weight:700;color:var(--paper)}
.mom-pulse-move{display:inline-flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:11px;color:var(--paper-dim)}
.mom-pulse-liq{flex:1 1 100%;font-family:var(--mono);font-size:11px;color:var(--paper-dim)}

/* ── идеи: тикер + сторона; план у Operator ───────────────────── */
.mom-ideas{margin:16px 24px 0;padding:16px;background:var(--ink-2);border:1px solid var(--white-08);border-radius:10px}
.mom-ideas-note{margin:0 0 12px;color:var(--paper-dim);font-size:11.5px}
.mom-tickers{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.mom-ticker{display:inline-flex;align-items:baseline;gap:8px;padding:4px 12px;
  border:1px solid var(--white-14);border-radius:999px;background:var(--ink-3)}
.mom-ticker b{font-size:12.5px;letter-spacing:.02em}
.mom-side{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.mom-side.long{color:var(--green)} .mom-side.short{color:var(--red)}
.mom-na{margin:0;color:var(--paper-dimmer);font-size:11.5px;list-style:none}
.mom-withheld{margin:12px 0 0;color:var(--paper-dimmer);font-size:10.5px}
.mom-dropped{margin:12px 24px 0;color:var(--paper-dimmer);font-family:var(--mono);font-size:11px}
.mom-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:20px 24px 0;
  color:var(--paper-dimmer);font-family:var(--mono);font-size:11px}

/* честное состояние: источник молчит */
.mom-empty{margin:24px;padding:24px;border:1px dashed var(--white-14);border-radius:14px;color:var(--paper-dim)}
.mom-empty h1{margin:0 0 12px;font-size:17px;color:var(--paper)}
.mom-empty p{margin:0;max-width:62ch;font-size:11.5px}
.mom-empty b{color:var(--paper)}

@media (max-width:720px){
  .term{flex-direction:column}
  .rail{position:static;width:100%;height:auto;flex:0 0 auto;flex-direction:row;overflow-x:auto;
    border-right:0;border-bottom:1px solid var(--white-08);padding:8px}
  .rail-mk{display:none}
  .rail-i{flex:0 0 auto;flex-direction:row;gap:8px;padding:8px 12px}
  .hdr{padding:10px 16px}
  .hdr-time{margin-left:0;width:100%;order:5}
  .mom-verdict,.mom-pulse,.mom-ideas,.mom-dropped,.mom-foot,.mom-h{margin-left:16px;margin-right:16px}
  .mom-gauges{padding-inline:16px;grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="term">
  <aside class="rail" aria-label="Вкладки">
    <svg class="rail-mk" width="32" height="32" viewBox="0 0 100 100" role="img" aria-label="Metatron">
      <polygon points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></polygon>
      <g fill="currentColor" opacity=".6">
        <circle cx="50" cy="10" r="3.6"/><circle cx="84.64" cy="30" r="3.6"/><circle cx="84.64" cy="70" r="3.6"/>
        <circle cx="50" cy="90" r="3.6"/><circle cx="15.36" cy="70" r="3.6"/><circle cx="15.36" cy="30" r="3.6"/>

    </span>
    <span class="rail-i locked" aria-disabled="true" title="доступно на тарифе Operator">
      <span class="rail-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/></svg><svg class="rail-lock" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>

      Монитор
    </span>
    <span class="rail-i locked" aria-disabled="true" title="доступно на тарифе Quant">
      <span class="rail-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9c2.5-4 4.5-4 7 0s4.5 4 7 0 4-3 6-1M2 17c2.5-4 4.5-4 7 0s4.5 4 7 0 4-3 6-1"/></svg><svg class="rail-lock" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      Волны
    </span>
    <span class="rail-i locked" aria-disabled="true" title="доступно на тарифе Quant">
      <span class="rail-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M12 4h.01M9 13v1.5M15 13v1.5"/></svg><svg class="rail-lock" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      Бот
    </span>
  </aside>

  <main class="work mom">
    <header class="hdr">
      <span class="hdr-brand">
        <svg class="hdr-mk" width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,10 84.64,30 84.64,70 50,90 15.36,70 15.36,30" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></polygon>
          <g fill="currentColor" opacity=".6">
            <circle cx="50" cy="10" r="3.6"/><circle cx="84.64" cy="30" r="3.6"/><circle cx="84.64" cy="70" r="3.6"/>
            <circle cx="50" cy="90" r="3.6"/><circle cx="15.36" cy="70" r="3.6"/><circle cx="15.36" cy="30" r="3.6"/>
          </g>
          <circle cx="50" cy="50" r="4.2" fill="currentColor"></circle>
        </svg>
        <span class="hdr-wm">
          <span class="hdr-nm">METATRON</span>
          <span class="hdr-ct">Trading Intelligence</span>
        </span>
      </span>
      <b class="hdr-tab">Момент</b>
      <span class="hdr-time" id="dt">—</span>
      <span class="hdr-chip" id="chip">получаем данные</span>
      <a class="hdr-cta" href="/#pricing">Ранний доступ</a>
    </header>

    <section class="mom-verdict na" id="vBox" aria-label="Вердикт дня">
      <span class="mom-light" id="vTitle">Загрузка…</span>
      <p class="mom-sub" id="vSub" hidden></p>
      <p class="mom-measured" id="vMeasured" hidden></p>

    <h2 class="mom-h">Приборы</h2>
    <section class="mom-gauges" id="gauges" aria-label="Приборы">
      <div class="mom-gauge"><span class="mom-g-lab">Массовое падение</span><span class="mom-g-val">—</span><span class="mom-g-bar"></span></div>
      <div class="mom-gauge"><span class="mom-g-lab">Рынок за 30 дней</span><span class="mom-g-val">—</span><span class="mom-g-bar"></span></div>
      <div class="mom-gauge"><span class="mom-g-lab">Фаза рынка</span><span class="mom-g-val">—</span><span class="mom-g-bar"></span></div>

      <ul class="mom-tickers" id="tickers"></ul>
      <p class="mom-withheld" id="withheld" hidden></p>
    </section>
    <p class="mom-dropped" id="dropped"></p>

    <footer class="mom-foot">
      <span id="footL">срез Observer</span>
      <span id="footR"></span>
    </footer>
  </main>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function set(id, txt){ var el=$(id); if(el && txt!=null) el.textContent=txt; }

  // Источник молчит — честный блок: «нет данных» и «рынок спокоен» разные вещи,
  // поэтому пустые приборы не рисуем.
  function fail(){
    var main=document.querySelector(".work");
    if(main){
      main.innerHTML='<section class="mom-empty" role="status">'
        + '<h1>Срез рынка недоступен</h1>'
        + '<p>Терминал не отдал повестку — показывать нечего. Это <b>не</b> «рынок спокоен», '
        + 'это отсутствие данных: срез обновится сам, когда источник ответит.</p></section>';
    }
  }

  function gauge(g){
    return '<div class="mom-gauge'+(g.dim?" dim":"")+'">'
      + '<span class="mom-g-lab">'+esc(g.label)+(g.meta?"<em>"+esc(g.meta)+"</em>":"")+'</span>'
      + '<span class="mom-g-val">'+esc(g.val)+'</span>'
      + '<span class="mom-g-bar"><i class="'+esc(g.color||"s1")+'" style="width:'
      +   Math.max(0,Math.min(100,+g.pct||0))+'%"></i></span>'
      + (g.cap?'<span class="mom-g-note">'+esc(g.cap)+'</span>':'')
      + '</div>';
  }

  function render(d){
    var v=d.verdict;
    if(!v){ fail(); return; }
    set("vTitle", v.title);
    var tone={green:"ok",yellow:"warn",red:"bad"}[v.light]||"na";
    $("vBox").className="mom-verdict "+tone;
    if(v.sub){ set("vSub", v.sub); $("vSub").hidden=false; }
    if(d.measured){ set("vMeasured", "◆ замерено · "+d.measured); $("vMeasured").hidden=false; }

    // Время в шапке — время ДАННЫХ (data_ts), не сборки: сборка обновляется каждую секунду,
    // а рынок в источнике может отставать. Разница видна текстом, а не замалчивается.
    var liveSrc = d.__src === "live";
    var dataAgeMin = null;
    if(d.data_ts){
      var dt = new Date(d.data_ts*1000);
      set("dt", "данные на " + ("0"+dt.getUTCHours()).slice(-2) + ":" + ("0"+dt.getUTCMinutes()).slice(-2) + " UTC");
      dataAgeMin = Math.max(0, Math.round((Date.now()/1000 - d.data_ts)/60));
    } else if(d.generated_utc){
      set("dt", "время данных неизвестно");
    }
    // Скринер пишет батчами (~раз в 15–20 мин по screener_state), поэтому «свежо» = уложились в цикл.
    // Порог 20 мин: не кричим зря, но и не выдаём 40-минутные данные за живые.
    var stale = (dataAgeMin !== null && dataAgeMin >= 20) || !!(d.pulse && d.pulse.stale);
    if(stale && dataAgeMin !== null) {
      set("dt", ($("dt").textContent || "") + " · отстают на " + dataAgeMin + " мин");
    }
    var chip=$("chip");
    chip.textContent = !liveSrc ? "снимок рынка" : (stale ? "данные отстают" : "живые данные");
    chip.className = "hdr-chip " + (liveSrc && !stale ? "ok" : "warn");

    var g=d.gauges||{}, parts=[];
    if(g.breadth) parts.push(gauge(g.breadth));
    if(g.drift) parts.push(gauge(g.drift));
    if(g.phase) parts.push(gauge(g.phase));
    if(parts.length) $("gauges").innerHTML=parts.join("");

    var p=d.pulse;
    if(p){
      set("pState", p.state);
      $("pMove").innerHTML=(p.move||[]).map(function(w){
        return "<span>"+esc(w.tf)+": ↓"+esc(w.dn)+" · ↑"+esc(w.up)+"</span>";
      }).join("");
      if(p.liq) set("pLiq", p.liq);
      $("pulse").hidden=false;
    }

    var ideas=d.ideas||{}, items=ideas.items||[];
    if(ideas.note) set("ideasNote", ideas.note);
    if(items.length){
      $("tickers").innerHTML=items.map(function(it){
        return '<li class="mom-ticker"><b>'+esc(it.sym)+'</b>'
          + '<span class="mom-side '+(it.side_cls==="short"?"short":"long")+'">'+esc(it.side)+'</span></li>';
      }).join("");
    } else {
      $("tickers").innerHTML='<li class="mom-na">сегодня проверку не прошла ни одна идея — это не ошибка</li>';
    }
    if(d.withheld && d.withheld.length){
      $("withheld").textContent="скрыто по тарифу: "+d.withheld.join("; ")+" — доступно на Operator";
      $("withheld").hidden=false;
    }
    if(d.dropped){ set("dropped", d.dropped); $("dropped").style.display=""; }
    else { $("dropped").style.display="none"; }

    set("footL", "срез Observer · " + (d.__src === "live" ? "живой канал · данные скринера, цикл ~15 мин" : "снимок на момент сборки"));
    set("footR", (d.generated_utc ? "собрано "+d.generated_utc+" · " : "") + (d.schema || ""));
  }

  // ── откуда данные (03.11) ─────────────────────────────────────────────
  // 1) ЖИВОЙ канал: https://api.metatronti.com/api/moment — отдельный туннель Cloudflare,
  //    открыт РОВНО на этот путь (остальное 404). Так данные свежие без деплоя Pages.
  // 2) Если канал молчит (ПК спит/туннель выключен) — аварийный снимок ./agenda.json,
  //    который лежит рядом и собирается скриптом. Бейдж честно говорит, что это снимок.
  var LIVE = "https://api.metatronti.com/api/moment";
  var REFRESH_MS = 45000;
  var lastGood = null;

  function fetchJson(url, ms){
    var c = typeof AbortController !== "undefined" ? new AbortController() : null;
    var t = setTimeout(function(){ if(c) c.abort(); }, ms);
    return fetch(url, {cache:"no-store", signal: c ? c.signal : undefined})
      .then(function(r){ clearTimeout(t); if(!r.ok) throw 0; return r.json(); });
  }

  function paint(d, src){
    d = d || {};
    d.__src = src;
    lastGood = d;
    render(d);
  }

  function load(){
    fetchJson(LIVE, 4000)
      .then(function(d){ paint(d, "live"); })
      .catch(function(){
        return fetchJson("./agenda.json?v="+Date.now(), 4000)
          .then(function(d){ paint(d, "snapshot"); })
          .catch(function(){
            if(lastGood){                       // уже что-то показано — не стираем экран
              var chip=$("chip");
              if(chip){ chip.textContent="нет обновления"; chip.className="hdr-chip warn"; }
            } else { fail(); }
          });
      });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
